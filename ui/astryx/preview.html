<!doctype html><html lang="zh-cn" data-theme="light" data-astryx-theme="neutral"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NRadio 管理界面预览</title><link rel="stylesheet" href="../../board/files/www/luci-static/astryx/astryx.css"></head>
<body class="astryx-ui nr-authenticated"><a class="nr-skip" href="#maincontent">跳到内容</a><div id="astryx-chrome" data-authenticated="1" data-hostname="NRadio" data-version="Snapshot" data-home="?page=overview"></div><div id="indicators"><button id="fixture-changes" class="cbi-button" hidden>未保存的更改：1</button></div>
<main id="maincontent" tabindex="-1"><div id="tabmenu"></div><div class="cbi-map"><h2>网络接口</h2><div class="cbi-map-descr">管理有线网络与蜂窝连接，查看接口状态并配置局域网。</div>
<div class="alert-message">界面预览 · 本页使用演示数据，所有操作仅作用于本地预览。</div>
<section class="cbi-section"><h3>接口概览</h3><table class="table"><thead><tr><th>接口</th><th>协议</th><th>IPv4 地址</th><th>状态</th><th></th></tr></thead><tbody><tr><td><strong>LAN</strong><br><small>局域网 · eth1</small></td><td>静态地址</td><td>192.168.1.1/24</td><td>已连接</td><td><button class="cbi-button" data-edit="LAN">编辑</button></td></tr><tr><td><strong>WAN</strong><br><small>有线广域网 · eth0</small></td><td>DHCP 客户端</td><td>192.0.2.2/24</td><td>已连接</td><td><button class="cbi-button" data-edit="WAN">编辑</button></td></tr><tr><td><strong>WWAN</strong><br><small>5G 蜂窝网络</small></td><td>NCM</td><td>—</td><td>未连接</td><td><button class="cbi-button" data-edit="WWAN">编辑</button></td></tr></tbody></table></section>
<section class="cbi-section"><h3>局域网设置</h3><div class="cbi-section-descr">为本地设备提供地址分配与网络接入。</div><form id="fixture-config"><div class="cbi-value"><label class="cbi-value-title" for="address">IPv4 地址</label><div class="cbi-value-field"><input id="address" name="address" class="cbi-input-text" value="192.168.1.1" required pattern="(?:[0-9]{1,3}\.){3}[0-9]{1,3}"><div class="cbi-value-description">修改后需要使用新的地址访问管理界面。</div></div></div><div class="cbi-value"><label class="cbi-value-title" for="mask">IPv4 子网掩码</label><div class="cbi-value-field"><select id="mask" name="mask"><option>255.255.255.0</option><option>255.255.0.0</option></select></div></div><div class="cbi-value"><label class="cbi-value-title" for="dhcp">DHCP 服务</label><div class="cbi-value-field"><input id="dhcp" type="checkbox" name="dhcp" checked> 为局域网设备自动分配 IP 地址</div></div><div class="cbi-page-actions"><button type="reset" class="cbi-button">重置</button><button type="submit" class="cbi-button cbi-button-apply">保存并应用</button></div></form></section></div></main>
<footer class="nr-version">NRadio C2000 Ultra <span>·</span> Snapshot</footer>
<script>
const query = new URLSearchParams(location.search), current = query.get('page') || 'network';
const groups = [{key:'status',title:'状态',pages:[['overview','总览'],['realtime','实时图表'],['logs','系统日志']]},{key:'network',title:'网络',pages:[['network','网络接口'],['wireless','无线网络'],['modem','5G 蜂窝'],['dhcp','DHCP / DNS'],['firewall','防火墙'],['routing','路由']]},{key:'system',title:'系统',pages:[['system','系统设置'],['admin','管理权'],['packages','软件包'],['backup','备份与升级'],['upgrade','在线固件更新'],['bootswitch','双系统切换'],['reboot','重启']]},{key:'services',title:'服务',pages:[['plugin','示例插件']]}];
window.nradioMenu={menu:groups.map(g=>({key:'admin/'+g.key,title:g.title,url:'?page='+g.pages[0][0],active:g.pages.some(p=>p[0]===current),children:g.pages.map(p=>({key:'admin/'+g.key+'/'+p[0],title:p[1],url:'?page='+p[0],active:p[0]===current,children:[]}))})),title:'网络接口',breadcrumb:['网络','网络接口']};
window.fixtureSubmitted=null;
const form=document.getElementById('fixture-config');
form.addEventListener('input',()=>{document.getElementById('fixture-changes').hidden=false});
form.addEventListener('submit',event=>{event.preventDefault();window.fixtureSubmitted=Object.fromEntries(new FormData(form));document.getElementById('fixture-changes').hidden=true});
document.querySelectorAll('[data-edit]').forEach(button=>button.addEventListener('click',()=>{const overlay=document.createElement('div');overlay.id='modal_overlay';overlay.innerHTML='<div class="modal"><h4>编辑接口 '+button.dataset.edit+'</h4><p>这是现有页面打开的编辑弹窗。</p><div class="right"><button class="cbi-button">关闭</button></div></div>';overlay.querySelector('button').onclick=()=>{overlay.remove();document.body.classList.remove('modal-overlay-active')};document.body.append(overlay);document.body.classList.add('modal-overlay-active')}));
if(query.has('login')){
 document.body.className='astryx-ui nr-auth';document.getElementById('astryx-chrome').dataset.authenticated='0';
 document.getElementById('maincontent').innerHTML='<form method="post" id="login"><div class="cbi-map"><h2>欢迎回来</h2><div class="cbi-map-descr">登录以管理网络与设备。</div><div class="cbi-section"><div class="cbi-value"><label class="cbi-value-title" for="username">用户名</label><div class="cbi-value-field"><input id="username" class="cbi-input-text" name="luci_username" value="root"></div></div><div class="cbi-value"><label class="cbi-value-title" for="password">密码</label><div class="cbi-value-field"><input id="password" class="cbi-input-text" name="luci_password" type="password"></div></div><input name="token" value="fixture-token" type="hidden"></div></div><div class="cbi-page-actions"><input type="submit" class="cbi-button cbi-button-apply" value="登录"></div></form>';
 document.getElementById('login').addEventListener('submit',event=>{event.preventDefault();window.fixtureSubmitted=Object.fromEntries(new FormData(event.target))});
}
</script><script type="module" src="../../board/files/www/luci-static/astryx/astryx.js"></script></body></html>
