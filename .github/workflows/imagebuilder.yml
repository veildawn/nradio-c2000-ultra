name: OpenWrt ImageBuilder (NRadio C2000 Ultra)

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      extra_packages:
        description: "Space-separated OpenWrt packages to preinstall"
        required: false
        default: "luci luci-ssl luci-proto-ncm luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn iw-full pciutils usbutils picocom"
      publish_release:
        description: "Publish built sysupgrade.bin as a GitHub Release"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node for JavaScript checks
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Lint board scripts and Python tooling
        run: |
          python3 -m py_compile board/apply.py board/inject_imagebuilder.py board/platform_upgrade.py
          find board/files/etc/board.d board/files/etc/init.d board/files/etc/hotplug.d board/files/etc/uci-defaults board/files/usr/sbin board/files/lib/functions board/files/lib/preinit -type f -print0 | xargs -0 -n 1 sh -n
          for script in board/files/www/luci-static/resources/view/nradio/*.js; do
            node --check "$script"
          done
          python3 - <<'PY'
          import json, pathlib
          for p in sorted(pathlib.Path('board/files').rglob('*.json')):
              json.loads(p.read_text())
              print('json ok:', p)
          PY

      - name: Test updater, modem snapshots and LuCI interactions
        run: |
          python3 -m pip install 'playwright>=1.50,<2'
          python3 -m playwright install --with-deps chromium
          python3 -m unittest discover -s tests -v

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential device-tree-compiler file gawk libncurses-dev python3 rsync unzip util-linux wget xz-utils zstd

      - name: Download official OpenWrt Snapshot Filogic ImageBuilder
        run: |
          mkdir -p /tmp/ib/extracted /tmp/ib/release
          curl -fL --retry 3 -o /tmp/ib/ib.tar.zst \
            https://downloads.openwrt.org/snapshots/targets/mediatek/filogic/openwrt-imagebuilder-mediatek-filogic.Linux-x86_64.tar.zst
          curl -fsSL https://downloads.openwrt.org/snapshots/targets/mediatek/filogic/version.buildinfo \
            -o /tmp/ib/version.buildinfo
          tar --use-compress-program=unzstd -xf /tmp/ib/ib.tar.zst -C /tmp/ib/extracted --strip-components=1
          rm -f /tmp/ib/ib.tar.zst

      - name: Inject NRadio C2000 Ultra board support
        run: |
          python3 -B board/inject_imagebuilder.py /tmp/ib/extracted

      - name: Pack custom sysupgrade.bin
        run: |
          EXTRA_PKGS="${{ inputs.extra_packages }}"
          if [ -z "$EXTRA_PKGS" ]; then
            EXTRA_PKGS="luci luci-ssl luci-proto-ncm luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn iw-full pciutils usbutils picocom"
          fi
          umask 022
          make -C /tmp/ib/extracted image \
            PROFILE="nradio_c2000-ultra" \
            PACKAGES="kmod-usb-net-cdc-ether ${EXTRA_PKGS}" \
            FILES="files-c2000-ultra"

      - name: Verify sysupgrade metadata and stage artifacts
        run: |
          BIN="/tmp/ib/extracted/bin/targets/mediatek/filogic/openwrt-mediatek-filogic-nradio_c2000-ultra-squashfs-sysupgrade.bin"
          DTB=(/tmp/ib/extracted/build_dir/target-*/linux-mediatek_filogic/image-mt7987a-nradio-c2000ultra.dtb)
          FACTORY_PART="/soc/spi@11009800/flash@0/partitions/partition@2d0000"
          test "$(fdtget "${DTB[0]}" "$FACTORY_PART" label)" = factory-firmware
          fdtget "${DTB[0]}" "$FACTORY_PART" read-only
          /tmp/ib/extracted/staging_dir/host/bin/fwtool -i /tmp/ib/meta.json "$BIN"
          python3 - <<'PY'
          import json, struct, tarfile
          with open("/tmp/ib/meta.json") as f:
              meta = json.load(f)
          assert meta["compat_version"] == "1.0", meta
          expected = {"nradio,c2000-ultra", "NRadio-C2000MAX-798", "NRadio-C2000MAX-Ultra", "NRadio-C2000Ultra"}
          assert expected == set(meta["supported_devices"]), meta["supported_devices"]
          with tarfile.open("/tmp/ib/extracted/bin/targets/mediatek/filogic/openwrt-mediatek-filogic-nradio_c2000-ultra-squashfs-sysupgrade.bin", "r") as tf:
              names = tf.getnames()
              assert any(n.endswith("/CONTROL") for n in names) and any(n.endswith("/kernel") for n in names) and any(n.endswith("/root") for n in names), names
              root = tf.getmember("sysupgrade-nradio_c2000-ultra/root")
              header = tf.extractfile(root).read(48)
              assert header[:4] == b"hsqs", "TF rootdisk requires SquashFS"
              bytes_used = struct.unpack_from("<Q", header, 40)[0]
              assert 0 < bytes_used <= root.size
              # fstools uses the superblock size, while both flashers use the tar member size.
              assert (bytes_used + 65535) // 65536 == (root.size + 65535) // 65536
          with open("/tmp/ib/extracted/bin/targets/mediatek/filogic/openwrt-mediatek-filogic-nradio_c2000-ultra.manifest") as mf:
              # APK manifests use "pkgname-version"; legacy OPKG used "pkgname - version".
              # The first whitespace token is the package name in both formats.
              pkgs = {line.split()[0] for line in mf if line.strip()}
          if "luci-i18n-base-zh-cn" in pkgs:
              for app in sorted(p for p in pkgs if p.startswith("luci-app-")):
                  i18n = f"luci-i18n-{app.removeprefix('luci-app-')}-zh-cn"
                  if i18n not in pkgs:
                      print(f"::warning::No Chinese translation package {i18n} for {app} (may not exist upstream for custom packages); skipping")
          PY
          cp -f /tmp/ib/extracted/bin/targets/mediatek/filogic/openwrt-mediatek-filogic-nradio_c2000-ultra* /tmp/ib/release/
          cp -f /tmp/ib/extracted/bin/targets/mediatek/filogic/profiles.json /tmp/ib/release/
          cp -f /tmp/ib/extracted/build_dir/target-*/linux-mediatek_filogic/image-mt7987a-nradio-c2000ultra.dtb /tmp/ib/release/
          (
            cd /tmp/ib/release
            sha256sum \
              openwrt-mediatek-filogic-nradio_c2000-ultra-squashfs-sysupgrade.bin \
              openwrt-mediatek-filogic-nradio_c2000-ultra.manifest \
              openwrt-mediatek-filogic-nradio_c2000-ultra.bom.cdx.json \
              profiles.json \
              image-mt7987a-nradio-c2000ultra.dtb > sha256sums
          )
          ls -lh /tmp/ib/release
          cat /tmp/ib/release/sha256sums

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-nradio-c2000-ultra-${{ github.run_number }}
          path: /tmp/ib/release/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REV="$(cat /tmp/ib/version.buildinfo | tr -d ' \r\n')"
          KVER="$(basename /tmp/ib/extracted/build_dir/target-*/linux-mediatek_filogic/linux-* | sed 's/^linux-//')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="openwrt-${REV}-$(date -u +%Y%m%d%H%M)"
          fi
          cat <<EOF > /tmp/ib/release_notes.md
          ## OpenWrt Official Snapshot (\`${REV}\` / Linux \`${KVER}\`) — NRadio C2000 Ultra

          基于**官方 OpenWrt \`main\` Snapshot \`mediatek/filogic\` ImageBuilder** 自动构建，遵循社区开源主线标准（不使用任何闭源 Wi-Fi 驱动或第三方魔改内核分支）。

          ### 核心特性
          - **内核与在线软件源**：Linux \`${KVER}\`，内核 \`vermagic\` 与 \`downloads.openwrt.org\` 官方 \`mediatek/filogic\` Snapshot 完全一致，刷入后可直接执行 \`apk update && apk add <pkg>\` 在线安装官方全部 \`kmod-*\` 与软件包。
          - **Wi-Fi 7 (\`MT7992\` BE5040)**：主线开源 \`mt76\`（\`kmod-mt7996e\` + \`kmod-mt7992-23-firmware\`），默认 \`country=CN\`，包含 PCIe \`pio38\` 硬复位、\`Factory\` \`0x1e00\` EEPROM 校准读取、严格单播 MAC 校验及单 wiphy MLD 双频独立 MAC（\`fac_mac + 2\` / \`+ 3\`）自动派生（修复 \`00:0c:43:*\` 模板 MAC 与 \`0b:00:43:*\` 组播脏 MAC）。
          - **默认无线**：新安装启用 \`NRadio-C2000-2G\` 和 \`NRadio-C2000-5G\`，使用 WPA2/WPA3 混合加密，初始密码为 \`12345678\`。
          - **5G 蜂窝 (\`MT5700M-CN\` \`3466:3301\`)**：内置 \`mt5700\` 守护服务（\`comgt-ncm\` + \`luci-proto-ncm\`），支持 USB 自动挂起抑制、\`cpe-pwr\` 冷断电自愈、热重启 USB 2.0 → USB 3.0 (\`5000M\`) 自动重训练、模组 NVRAM 异常自愈（兼容原厂双系统 \`SETMODE=1\`，自动恢复 \`TDCFG\` 网卡模式与 \`C5GOPTION\` 5G SA）、三路 SIM 卡（外置 SIM1 / SIM2 / 内置 eSIM）自动切换、四大运营商 APN 自动配置、\`fw4\` 防火墙域与单 \`/64\` IPv6 \`odhcpd\` \`ndp=relay\` 下发及 5G/4G 指示灯同步。
          - **内置 \`luci-app-nradio-c2000\` 中文管理页（本仓库自带，随固件预装）**：**网络 → 5G 蜂窝**——模组/SIM（三卡槽切换、IMSI/ICCID、运营商与注册状态）、\`AT^HCSQ\` 信号质量（RSRP/SINR/RSRQ/EcIo 分制式解码 + 信号条）、蜂窝连接 IPv4/IPv6、模组温度实时状态（守护进程每周期刷新 stamp，切卡/拨号期间如实显示「正在切换/检测中/未检测到 SIM 卡」，绝不展示过期数据），并可在页面直接配置 SIM 卡槽/APN/USB3 重训练/NVRAM 自愈/高温联动散热/巡检间隔；**系统 → 双系统切换**——Web 一键切换回原厂固件（\`boot_from_sd\` 写入前自动校验 SPI-NOR CRC32，含确认弹窗、待重启警告与一键取消切回）；**系统 → 在线固件更新**——直连本仓库 GitHub Release 检查新版本（SHA-256 摘要来自 api.github.com）、下载校验后可选「保留配置 / 不保留配置」一键 sysupgrade（支持自定义下载加速前缀）。
          - **有线、散热与系统**：\`LAN = eth1\`（片内 2.5G PHY）、\`WAN = eth0\`（Airoha \`EN8811H\` 2.5G PHY）、静音温控风扇曲线（\`<65 °C\` 停转，\`65 / 75 / 85 °C\` 渐进调速 + \`AT^CHIPTEMP?\` 5G 模组高温联动散热）、\`zram-swap\`（\`1 GiB\` DDR4 下 \`50%\` 自适应 \`493 MiB\` \`lzo-rle\` 压缩交换 + \`swappiness=100\`）、\`uboot-envtools\` 严格 CRC32 校验探测与 \`c2000-bootswitch\` 双系统安全切换工具，预装完整汉化 **LuCI**（含 \`luci-i18n-base-zh-cn\`、\`luci-i18n-firewall-zh-cn\`、\`luci-i18n-package-manager-zh-cn\`、\`luci-ssl\`、\`luci-proto-ncm\`、\`iw-full\`、\`pciutils\`、\`usbutils\`、\`picocom\`）。

          ### 刷入、SSH 登录与双系统切换说明
          - **同内核版本在线升级**：同内核版本可用「在线固件更新」。保留配置和清除配置都只针对 TF 卡上的 OpenWrt。同一设备的原厂设置继续使用板载闪存。
          - **首次登录与 SSH 说明**：默认管理地址 \`http://192.168.1.1\`（首次网页登录 \`root\` 无密码）。净刷后 Dropbear 允许空密码 \`root\` SSH 首登（LuCI 不可用时的救援通道），**登录后请立即在网页「系统 → 管理权」或 SSH \`passwd\` 设置密码**；若本机此前连过 \`192.168.1.1\` 提示密钥变更，先执行 \`ssh-keygen -R 192.168.1.1\` 再连接。
          - **从原厂双系统固件刷入**：插好已分区 TF 卡后，在原厂双系统切换/升级页面上传该 \`sysupgrade.bin\`（未签名 \`ustar\` \`compat_version 1.0\`，内置 \`NRadio-C2000MAX-798\` / \`NRadio-C2000MAX-Ultra\` / \`NRadio-C2000Ultra\` / \`nradio,c2000-ultra\` 兼容板名与 \`0x40080000\` FIT 入口）。
          - **双系统无损切回原厂固件**：在 LuCI「系统 → 双系统切换」页面一键切换（推荐），或在 OpenWrt SSH 中执行 \`c2000-bootswitch to-factory && reboot\`（自动校验 SPI-NOR \`u-boot-env\` CRC32 并将 \`boot_from_sd\` 设为 \`0\`，无需拔出 TF 卡）。

          ### SHA-256 校验值
          \`\`\`text
          $(cat /tmp/ib/release/sha256sums)
          \`\`\`
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/ib/release/* --clobber
            gh release edit "$TAG" \
              --title "OpenWrt Snapshot ${REV} (Linux ${KVER}) for NRadio C2000 Ultra" \
              --notes-file /tmp/ib/release_notes.md
          else
            gh release create "$TAG" /tmp/ib/release/* \
              --title "OpenWrt Snapshot ${REV} (Linux ${KVER}) for NRadio C2000 Ultra" \
              --notes-file /tmp/ib/release_notes.md
          fi
